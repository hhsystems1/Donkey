[build]
  publish = "."

# old URLs from the first version
[[redirects]]
  from = "/course/*"
  to = "/learn/"
  status = 301
[[redirects]]
  from = "/gear/*"
  to = "/parents/#helmet"
  status = 301
[[redirects]]
  from = "/interactive-web-course.html"
  to = "/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
